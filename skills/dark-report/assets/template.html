<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="theme-color" content="{{THEME_COLOR}}">
<meta name="color-scheme" content="dark">
{{META}}
{{MARKER}}
<style>
{{THEME}}
</style>
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header" data-dark-report-header>
  <div class="shell header-inner">
    <a class="doc-mark" href="#content">
      <span class="led" aria-hidden="true"></span>
      <span class="doc-label">{{LABEL}}</span>
    </a>
    {{HEADER_NAV}}
  </div>
</header>
<main id="content" class="shell" data-dark-report-content>
  <article class="doc">
    {{MASTHEAD}}
    {{TOC}}
    <div class="doc-body" data-dark-report-body>
{{BODY}}
    </div>
    {{FOOTER}}
  </article>
</main>
</body>
</html>
